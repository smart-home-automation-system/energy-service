spring:
  application:
    name: energy-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/energy"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    # the events of every device (HAS-327): the Shelly devices over MQTT and the Eaton devices from
    # amx-service, all on amq.topic of /device, each queue bound with "#"
    username: device
    # no default on purpose: with one the pod would start, turn Ready and consume nothing.
    # Without the variable the service does not start - cholewa.required-properties sees to that,
    # the binder alone would take the placeholder for the password
    password: ${rabbitmq-password}
    virtual-host: /device
    connection-timeout: 10s
    requested-heartbeat: 10s
    template:
      # both default to false; without them the trace breaks at the queue
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        # the listener returns a Mono; with the default AUTO mode the container acks before the
        # message is handled, so prefetch throttles nothing and the ack is sent twice
        acknowledge-mode: manual
        # how many events are in flight at once, the rest waits in the broker - as in light-service
        prefetch: 3
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database.username}
    password: ${database.password}
    enabled: on

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  # no default on purpose: cholewa.required-properties refuses the start without it, before Flyway or
  # the pool try a password that is not one
  password: ${database-password}
  pool:
    # this service's share of the 47 connections of the managed database (heating 2 / database 4 /
    # water 2 / presence 2 / blinds 2 / weather 2 / light 2 / appliance 2 / energy 2 - 20 allotted, with
    # the 3 of ristretto 23 of 47, HAS-325). A rollout holds the pool twice and Flyway opens one more
    # connection
    max-size: 2

rabbitmq:
  queue:
    name: device.prod.energy

energy:
  # the grid meter (Shelly Pro 3EM, HAS-327): its MQTT id and its address from the manifest - no default, the
  # address is private; a reading older than stale-after is served as stale (it publishes about every 5 s)
  meter:
    device-id: ${meter-device-id}
    address: ${meter-address}
    stale-after: PT2M
  # the SOLAX inverter and its battery over the local API of its dongle (HAS-328); the inverter itself - its
  # address and the registration number of the dongle - comes from the device registry (kind inverter, brand
  # solax). Read every interval (10 - 60 s); a reading older than stale-after is served as stale. The usable
  # capacity of the battery of the plant (SolaxCloud: 26.5 kWh) gives the energy left from the SOC
  solax:
    interval: PT15S
    stale-after: PT1M
    battery-capacity: 26.5
    # the SolaX Developer Platform (HAS-329): the backup of the dongle (the inverter and its battery every interval), the
    # alarms of the plant every alarm-interval; a cloud answer older than stale-after is not served. The application of
    # the owner and the plant from the manifest (the secret energy) - no default
    cloud:
      base-url: https://openapi-eu.solaxcloud.com
      client-id: ${solax-client-id}
      client-secret: ${solax-client-secret}
      plant-id: ${solax-plant-id}
      interval: PT5M
      alarm-interval: PT15M
      stale-after: PT15M
      # error codes the household is not told of: 17 Bat Power Low - the battery at its floor, almost every day
      ignored-alarm-codes: "17"
  # the outages of the grid as the SOLAX sees them (HAS-334): one more alert by SMS when the battery falls below
  # low-soc % during an outage, a reminder every reminder-every while it lasts
  outage:
    low-soc: 20
    reminder-every: PT1H
  # the silence of the sources (HAS-332): the dongle of the SOLAX not answering and the grid meter silent on MQTT and
  # RPC for this long is an alert, a reminder every reminder-every while it lasts, an info on its return
  availability:
    solax-silent-after: PT5M
    meter-silent-after: PT5M
    reminder-every: PT1H
  # the overload of a phase of the grid meter (HAS-332): above phase-current-warn A for overload-after is a warning,
  # below for as long ends it with an info (the main fuses are 3 x 25 A, the board of the inverter 20 A a phase)
  grid:
    phase-current-warn: 22
    overload-after: PT3M

# the notifications of the outages (HAS-334): the exchange is on the same broker as spring.rabbitmq.*, on its own
# virtual host - a second connection (NotificationRabbitConfig); env is one of the two headers it routes by.
# cholewa.notification.enabled of cholewa-commons stays unset: its publisher uses the connection to /device
notification:
  virtual-host: /notification
  username: notification
  # no default on purpose: with one the pod would start and fail every publish (cholewa.required-properties)
  password: ${notification-rabbitmq-password}
  exchange: notification
  env: prod

internal:
  service:
    # the device registry: the inverters of the house (HAS-326)
    database: http://database-service:6200

cholewa:
  # refuses the start before the first bean when one of these has no value (cholewa-commons >= 1.9.0)
  required-properties:
    - property: database.password
      variable: database-password
    - property: spring.rabbitmq.password
      variable: rabbitmq-password
    - property: notification.password
      variable: notification-rabbitmq-password
    - property: energy.meter.device-id
      variable: meter-device-id
    - property: energy.meter.address
      variable: meter-address
    - property: energy.solax.cloud.client-id
      variable: solax-client-id
    - property: energy.solax.cloud.client-secret
      variable: solax-client-secret
    - property: energy.solax.cloud.plant-id
      variable: solax-plant-id

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform — and kept in the shared
      # document, where the paths can be exercised locally on 8014 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost

rabbitmq:
  queue:
    name: device.dev.energy

notification:
  env: dev

internal:
  service:
    database: http://localhost:6005

server:
  port: 6014
management:
  server:
    port: 8014

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
---

spring:
  config:
    activate:
      on-profile: test
  # a context test starts the listener: the broker is at an address nothing listens on, so that a test cannot
  # reach it even where the name resolves
  rabbitmq:
    host: localhost
    port: 1
    password: test
  flyway:
    enabled: false

# the pool opens nothing eagerly, and Flyway is off: a context test never reaches a database
database:
  password: test

rabbitmq:
  queue:
    name: device.test.energy

notification:
  password: test
  env: test

# a meter that is not the one of the house, at an address nothing listens on
energy:
  meter:
    device-id: shellypro3em-000000000000
    address: localhost:1
  # a cloud at an address nothing listens on, an application and a plant that are not the ones of the house
  solax:
    cloud:
      base-url: http://localhost:1
      client-id: test
      client-secret: test
      plant-id: "1000000000000000000"

internal:
  service:
    database: http://localhost:1

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
